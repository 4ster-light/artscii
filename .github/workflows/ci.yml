name: CI

# PRs and merge queue entries are the gate. Direct pushes to main do not
# re-run CI, so a validated PR does not duplicate the full check.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

# Superseded runs on the same PR are cancelled; merge queue entries keep
# their result, they are the pre-merge record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # Keep the crane build inputs around so the store cache is useful
            # across runs instead of being collected as garbage.
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 6G

      # Keep the packaging metadata in lockstep with the workspace version; the
      # COPR spec carries its own Version: because RPM needs it, and drift there
      # silently publishes a mislabelled package.
      - name: Check packaging versions match the workspace
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -n1)
          spec=$(awk '/^Version:/{print $2; exit}' packaging/fedora/artscii.spec)
          echo "workspace=$version spec=$spec"
          if [ -z "$version" ] || [ "$version" != "$spec" ]; then
            echo "::error::packaging/fedora/artscii.spec Version ($spec) does not match [workspace.package] version ($version)"
            exit 1
          fi
      # Trunk's wasm-bindgen-cli is derived from the exact wasm-bindgen pin
      # in the web manifest (nix/crane.nix), so that pin must stay an exact
      # =X.Y.Z requirement and no hand-synced nixpkgs attribute may return.
      - name: Check wasm-bindgen tooling matches the web manifest
        run: |
          set -euo pipefail
          pin=$(sed -n 's/^wasm-bindgen *= *"=\([0-9.]*\)"$/\1/p' crates/artscii-web/Cargo.toml | head -n1)
          if [ -z "$pin" ]; then
            echo "::error::crates/artscii-web/Cargo.toml must pin wasm-bindgen exactly (=X.Y.Z); the Nix side derives wasm-bindgen-cli from it"
            exit 1
          fi
          want="wasm-bindgen-cli_$(echo "$pin" | tr . _)"
          bad=$(grep -rhoE 'wasm-bindgen-cli_[0-9]+(_[0-9]+)+' nix/ | sort -u | grep -vxF "$want" || true)
          if [ -n "$bad" ]; then
            echo "::error::hardcoded attribute $bad in nix/ does not match wasm-bindgen =$pin in crates/artscii-web/Cargo.toml"
            exit 1
          fi
          echo "wasm-bindgen=$pin tooling=$want"

      # `nix flake check` does not cover Nix formatting, so run the flake's own
      # formatter in check mode. This is deliberately not a flake check: a local
      # `nix flake check` should not spawn a treefmt fan-out on a laptop.
      - name: Check Nix formatting
        run: nix fmt -- --ci

      # One job, one command: `checks.{fmt,clippy,test,doc,web-clippy,web-build,artscii}`
      # all run through the flake, so this is exactly what `nix flake check`
      # does locally with the pinned toolchain and system dependencies.
      # `--keep-going` reports every failing check in a single run instead of
      # stopping at the first one.
      - name: nix flake check
        run: nix flake check --keep-going --no-update-lock-file --print-build-logs
