name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: Verify tag matches workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag with [workspace.package] version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -n1)
          if [ -z "$version" ]; then
            echo "::error::could not read the version from [workspace.package]"
            exit 1
          fi
          # v2.1.0-rc.1 must be built from a workspace version of 2.1.0
          base="${tag%%-*}"
          echo "tag=$GITHUB_REF_NAME workspace-version=$version (compared: $base)"
          if [ "$base" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: artscii-linux-x86_64

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: artscii-linux-aarch64

          - os: macos-latest
            target: aarch64-apple-darwin
            asset: artscii-macos-aarch64

          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: artscii-macos-x86_64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: artscii-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Resolve asset names
        shell: bash
        run: |
          ext=""
          [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          echo "PLAIN_ASSET=${{ matrix.asset }}${ext}" >> "$GITHUB_ENV"

          # Linux publishes two assets per architecture: a standalone binary
          # (`artscii-linux-*`, dynamically linked against the distro's
          # ffmpeg/alsa, used by cargo-binstall) and a self-contained bundle
          # (`artscii-linux-*.tar.gz`, libraries plus `$ORIGIN` rpath, used by
          # install.sh).
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "BUNDLE_ASSET=${{ matrix.asset }}.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y patchelf \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswscale-dev \
            libswresample-dev \
            libasound2-dev

      - name: Install system dependencies (macOS aarch64)
        if: runner.os == 'macOS' && matrix.target == 'aarch64-apple-darwin'
        run: |
          brew install ffmpeg
          prefix=$(brew --prefix ffmpeg)
          echo "FFMPEG_LIB_DIR=${prefix}/lib" >> $GITHUB_ENV
          echo "FFMPEG_INCLUDE_DIR=${prefix}/include" >> $GITHUB_ENV

      - name: Install system dependencies (macOS x86_64)
        if: runner.os == 'macOS' && matrix.target == 'x86_64-apple-darwin'
        run: |
          softwareupdate --install-rosetta --agree-to-license 2>/dev/null || true
          if ! arch -x86_64 /usr/local/bin/brew --version &>/dev/null; then
            arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" </dev/null
          fi
          arch -x86_64 /usr/local/bin/brew install ffmpeg
          echo "FFMPEG_LIB_DIR=/usr/local/opt/ffmpeg/lib" >> $GITHUB_ENV
          echo "FFMPEG_INCLUDE_DIR=/usr/local/opt/ffmpeg/include" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_SYSROOT_DIR=/usr/local" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/local/opt/ffmpeg/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z"
          curl -L -o ffmpeg.7z $url
          $ffDir = "$env:RUNNER_TEMP\ffmpeg"
          7z x ffmpeg.7z "-o$ffDir" -y
          $devDir = Get-ChildItem "$ffDir\ffmpeg-*" | Select-Object -First 1
          "FFMPEG_DIR=$($devDir.FullName)" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --release --locked -p artscii-cli --features video,audio --target ${{ matrix.target }}
        shell: bash

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/artscii

      - name: Stage standalone binary
        shell: bash
        run: |
          ext=""
          [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/artscii${ext}" "$PLAIN_ASSET"

      - name: Bundle runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          exe="target/${{ matrix.target }}/release/artscii"
          mkdir -p dist
          cp "$exe" dist/artscii

          SYS_LIBS='linux-vdso|ld-linux|libc\.so|libm\.so|libpthread|libdl\.so|librt\.so|libgcc_s|libstdc\+\+|libresolv|libnss_|libselinux|libpcre'

          bundle_libs() {
            for lib in $(ldd "$1" 2>/dev/null | awk '/=> \// {print $3}'); do
              local name=$(basename "$lib")
              if echo "$name" | grep -qE "$SYS_LIBS"; then continue; fi
              if [ -f "dist/$name" ]; then continue; fi
              cp "$lib" "dist/"
              bundle_libs "dist/$name"
            done
          }

          bundle_libs dist/artscii
          patchelf --set-rpath '$ORIGIN' dist/artscii
          for so in dist/*.so*; do
            patchelf --set-rpath '$ORIGIN' "$so" 2>/dev/null || true
          done
          tar czf "$BUNDLE_ASSET" -C dist .

      - name: Generate checksums
        shell: bash
        run: |
          for asset in "$PLAIN_ASSET" ${BUNDLE_ASSET:+"$BUNDLE_ASSET"}; do
            [ -f "$asset" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$asset" > "$asset.sha256"
            else
              shasum -a 256 "$asset" > "$asset.sha256"
            fi
          done

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          # Plain binary (and its checksum), plus the Linux bundle when there
          # is one. Anything else in the workspace root does not start with
          # `artscii-`.
          files: |
            ./artscii-*
          # Tags with a pre-release suffix (for example v2.0.1-rc.1) must not
          # be published as the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  checksums:
    name: Aggregate checksums
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download per-asset checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p sums
          cd sums
          gh release download "${{ github.ref_name }}" --pattern '*.sha256'
          cat ./*.sha256 > SHA256SUMS

      - name: Upload SHA256SUMS
        uses: softprops/action-gh-release@v2
        with:
          files: sums/SHA256SUMS
          prerelease: ${{ contains(github.ref_name, '-') }}

  copr:
    name: Build RPM in COPR (${{ contains(github.ref_name, '-') && 'artscii-testing' || 'artscii' }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm make curl python3-pip
          python3 -m pip install --user --quiet --break-system-packages copr-cli

      - name: Configure copr-cli
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          if [ -z "$COPR_CONFIG" ]; then
            echo "::error::COPR_CONFIG secret is not set"
            exit 1
          fi
          mkdir -p "$HOME/.config"
          printf '%s\n' "$COPR_CONFIG" > "$HOME/.config/copr"
          chmod 600 "$HOME/.config/copr"

      - name: Build SRPM and submit to COPR
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          tag="${GITHUB_REF_NAME#v}"
          if [ "${tag#*-}" != "$tag" ]; then
            # Release candidate: the testing project gets a spec that hardcodes
            # the v2.1.0-rc.1 source tag and a 0.<n> release (so each RC
            # upgrades the previous one). Baking it into the spec is required
            # because COPR re-runs rpmbuild -bs on the spec inside the SRPM.
            project=artscii-testing
            prerelease="-${tag#*-}"
            rc="${tag##*.}"
            sed -i \
              -e "s|^%global git_tag .*|%global git_tag      v%{version}${prerelease}|" \
              -e "s|^%global archive_name .*|%global archive_name %{name}-%{version}${prerelease}|" \
              -e "s|^Release:.*|Release:        0.${rc}%{?dist}|" \
              packaging/fedora/artscii.spec
          else
            project=artscii
          fi
          make -C packaging/fedora srpm
          srpm=$(ls packaging/fedora/*.src.rpm)
          echo "Submitting $(basename "$srpm") to 4ster-light/$project"
          copr-cli build "4ster-light/$project" "$srpm" --nowait

  container:
    name: Build container image (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          tag="${GITHUB_REF_NAME#v}"
          docker build \
            --file packaging/container/Containerfile \
            --tag "ghcr.io/${{ github.repository }}:${tag}-${{ matrix.arch }}" \
            .

      - name: Push image
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/${{ github.repository }}:${tag}-${{ matrix.arch }}"

  container-manifest:
    name: Publish multi-arch container manifest
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Create and push manifest
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          tag="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${{ github.repository }}"
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker manifest create "$image:$tag" "$image:${tag}-amd64" "$image:${tag}-arm64"
          docker manifest push "$image:$tag"
          if [ "${tag#*-}" = "$tag" ]; then
            docker manifest create "$image:latest" "$image:${tag}-amd64" "$image:${tag}-arm64"
            docker manifest push "$image:latest"
          fi
