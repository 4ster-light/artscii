[package]
name = "artscii-img"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Image conversion library for ArtSCII"
license.workspace = true
repository.workspace = true
keywords = ["ascii", "art", "image", "library"]
categories = ["multimedia::images"]

[dependencies]
artscii-core = { path = "../artscii-core" }
colored = { version = "3.0.0", optional = true }
html-escape = "0.2.13"
image = "0.25.9"
thiserror = "2.0.17"

[features]
default = []
cli = ["artscii-core/cli", "colored"]
