[package]
name = "artscii-video"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Video conversion library for ArtSCII"
license.workspace = true
repository.workspace = true
keywords = ["ascii", "art", "video", "library"]
categories = ["multimedia::video"]

[dependencies]
artscii-core = { path = "../artscii-core" }
artscii-img = { path = "../artscii-img" }
anyhow = "1.0.100"
cpal = { version = "0.17.3", optional = true }
# Only the parts of ffmpeg we use: this keeps libavfilter/libavdevice (and with
# them ALSA on Linux) out of the dependency graph.
ffmpeg-next = { version = "9.0.0", default-features = false, features = [
    "codec",
    "format",
    "software-resampling",
    "software-scaling",
] }
gif = "0.14.0"
font8x8 = "0.3.1"
image = "0.25.9"
thiserror = "2.0.17"

[features]
default = []
# Terminal audio playback (cpal -> ALSA/CoreAudio). MP4 audio passthrough uses
# ffmpeg directly and works without this.
audio = ["dep:cpal"]
# Link against a static ffmpeg (see `PKG_CONFIG_ALL_STATIC` / `ffmpeg-next/static`).
# Only the portable musl builds use this; native packages take the shared one.
static-ffmpeg = ["ffmpeg-next/static"]
