[package]
name = "artscii-cli"
version = "2.0.1-rc.2"
edition = "2024"
authors = ["4ster-light"]
description = "Command-line interface for ArtSCII"
license = "MIT"
repository = "https://github.com/4ster-light/artscii"
keywords = ["ascii", "art", "image", "cli", "terminal"]
categories = ["command-line-utilities", "multimedia::images", "multimedia::video"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive", "color"] }
colored = "3.0.0"
artscii-img = { path = "../artscii-img", features = ["cli"] }
artscii-video = { path = "../artscii-video", optional = true }

[features]
default = ["video"]
video = ["dep:artscii-video"]

[[bin]]
name = "artscii"
path = "src/main.rs"

# Prebuilt binaries are published to GitHub Releases with non-standard names.
# These overrides let `cargo binstall` fetch them on macOS and Windows. On
# Linux the release is a self-contained bundle (binary + ffmpeg/alsa libs),
# which binstall cannot unpack into place, so it falls back to building from
# source there; use install.sh for a bundled Linux binary.
[package.metadata.binstall]
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/artscii-macos-aarch64"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/artscii-macos-x86_64"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/artscii-windows-x86_64.exe"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "bin"
