[package]
name = "artscii-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Command-line interface for ArtSCII"
license.workspace = true
repository.workspace = true
keywords = ["ascii", "art", "image", "cli", "terminal"]
categories = ["command-line-utilities", "multimedia::images", "multimedia::video"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive", "color"] }
colored = "3.0.0"
artscii-img = { path = "../artscii-img", features = ["cli"] }
artscii-video = { path = "../artscii-video", optional = true }

[features]
default = ["video", "audio"]
# Video decoding, GIF/MP4 export and MP4 audio passthrough.
video = ["dep:artscii-video"]
# Terminal audio playback during `--video`; implies `video`.
audio = ["video", "artscii-video/audio"]
# Link a static ffmpeg instead of the system shared libraries.
static-ffmpeg = ["artscii-video/static-ffmpeg"]

[[bin]]
name = "artscii"
path = "src/main.rs"

# Prebuilt binaries are published to GitHub Releases with non-standard names.
# These overrides let `cargo binstall` fetch them on macOS and Windows. On Linux
# there is deliberately no override: the standalone `artscii-linux-*` binary is
# built on Ubuntu 24.04 and therefore hard-links that distro's ffmpeg sonames
# (libavcodec.so.60, ...), so it only runs on ffmpeg 6 systems. binstall cannot
# check libraries before installing, and a source build links the local ffmpeg,
# which is correct everywhere; the self-contained `artscii-linux-*.tar.gz`
# bundle is not usable either because binstall extracts only the binary.
[package.metadata.binstall]
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/artscii-macos-aarch64"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/artscii-macos-x86_64"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/artscii-windows-x86_64.exe"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "bin"
